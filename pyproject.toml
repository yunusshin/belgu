[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "belgu"
version = "0.5.0"
description = "Belgü local investigation workbench"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "dnspython>=2.7,<3",
  "httpcore>=1.0,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "playwright>=1.58,<2",
  "Pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
belgu = "belgu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
belgu = ["analysis/prompts/*.txt", "demo/assets/*.png", "demo/assets/*.html", "demo/assets/*.json"]

[tool.setuptools.data-files]
"share/belgu" = ["alembic.ini"]
"share/belgu/migrations" = ["migrations/env.py"]
"share/belgu/migrations/versions" = ["migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
